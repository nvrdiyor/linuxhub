  <circle cx="44" cy="27" r="1.5" fill="#fff"/>
  <circle cx="58" cy="27" r="1.5" fill="#fff"/>
  <!-- Beak -->
  <path d="M45 36 Q50 42 55 36 Q50 38 45 36" fill="#f59e0b"/>
  <!-- Feet -->
  <ellipse cx="38" cy="93" rx="10" ry="5" fill="#f59e0b"/>
  <ellipse cx="62" cy="93" rx="10" ry="5" fill="#f59e0b"/>
  <!-- Wings -->
  <ellipse cx="22" cy="58" rx="8" ry="20" fill="url(#penguinGrad)" transform="rotate(-15 22 58)"/>
